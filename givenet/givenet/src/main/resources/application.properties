#spring.datasource.password=@ITB123456

# =============================================
# LOCAL - NOTEBOOK (autenticacao integrada do Windows)
# =============================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=givenet;instanceName=SQLEXPRESS;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=false;trustServerCertificate=true;loginTimeout=30;socketTimeout=30
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# NativeAuthentication usa a conta Windows do processo; nao informe usuario ou senha.

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# O schema do banco ja existe; evita consulta de migracao que expira no SQL Server Express.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Autenticacao JWT: configure o segredo como variavel de ambiente.
# O segredo deve ter no minimo 256 bits; use Base64 (ex.: openssl rand -base64 32).
givenet.jwt.secret=${GIVENET_JWT_SECRET}
givenet.jwt.expiration=${GIVENET_JWT_EXPIRATION_MS:900000}
givenet.jwt.refresh-expiration=${GIVENET_JWT_REFRESH_EXPIRATION_MS:604800000}
givenet.cors.allowed-origins=${GIVENET_CORS_ALLOWED_ORIGINS:http://localhost:5173}